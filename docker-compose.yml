version: '3.8'

services:
  system-monitor:
    build: ./backend
    container_name: system-monitor
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend:ro
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    privileged: true
    pid: host
